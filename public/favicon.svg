<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Vibrant 3D Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B69"/>
      <stop offset="45%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#9F1239"/>
    </linearGradient>

    <!-- Gloss Specular Highlight -->
    <radialGradient id="heartShine" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Ambient Drop Shadow -->
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#881337" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 3D Red Heart Emoji Base -->
  <path d="M 50,88 C 47.5,85.5 10,56 5,33 C 1,15 14,2 29,2 C 38,2 45.5,8 50,15 C 54.5,8 62,2 71,2 C 86,2 99,15 95,33 C 90,56 52.5,85.5 50,88 Z"
        fill="url(#heartGrad)" filter="url(#heartShadow)"/>

  <!-- Top-Left Gloss Highlight Arc -->
  <path d="M 28,6 C 18,6 10,14 11,24 C 11.5,30 15,41 27,51 C 21,41 18,29 19,22 C 20,14 27,10 33,10 C 37,10 42,13 45,17 C 41,11 35,6 28,6 Z"
        fill="url(#heartShine)" opacity="0.95"/>

  <!-- Glint Sparkle Specular Highlight -->
  <circle cx="32" cy="21" r="2.8" fill="#FFFFFF"/>
</svg>