<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Modern Tech / Creative Gradient -->
    <linearGradient id="spGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Crisp Stroke Gradient -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <filter id="spShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#4338CA" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Modern Squircle Base -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#spGrad)" filter="url(#spShadow)"/>

  <!-- Glass Arc Highlight -->
  <rect x="5" y="5" width="54" height="27" rx="15" fill="url(#glassGrad)"/>

  <!-- Geometric 3D Project Prism (Isometric Cube / Digital Mark) -->
  <g fill="none" stroke="url(#strokeGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Hex Prism Frame -->
    <path d="M32 14 L49 24 L49 42 L32 51 L15 42 L15 24 Z"/>
    <!-- Inner Isometric Axes -->
    <path d="M32 32 L32 51"/>
    <path d="M32 32 L49 24"/>
    <path d="M32 32 L15 24"/>
  </g>

  <!-- Glowing Central Core Spark -->
  <circle cx="32" cy="32" r="3.5" fill="#FFFFFF"/>
  <circle cx="32" cy="14" r="2.5" fill="#FBCFE8"/>
  <circle cx="49" cy="24" r="2.5" fill="#DDD6FE"/>
  <circle cx="15" cy="24" r="2.5" fill="#C7D2FE"/>
</svg>